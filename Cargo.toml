[workspace]
members = [
  "crates/nctforge-core",
  "crates/nctforge-dicom",
  "crates/nctforge-transport",
  "crates/nctforge-evidence",
  "crates/nctforge-openmc",
  "crates/nctforge-cli",
  "crates/nctforge-gui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Avila Labs"]
repository = "https://github.com/AvilaLabs/NCTForge"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
dicom-core = "=0.10.0"
dicom-dictionary-std = "=0.10.0"
dicom-object = "=0.10.0"
eframe = "0.36.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v5"] }

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
